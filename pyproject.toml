[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lens-observe"
version = "0.0.1"
description = "The Lens — observe: compute signals (active/orphaned/degrading/blind) over activity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Liz Osborn" }]
keywords = ["the-lens", "systems-observatory", "knowledge-mapping", "nearly-decomposable"]
# Stdlib-only at runtime by design, so `lens-observe --help` works the moment pip install completes.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lens-observe = "lens_observe.launch:main"

[project.urls]
Homepage = "https://github.com/Lizo-RoadTown/lens-observe"
Repository = "https://github.com/Lizo-RoadTown/lens-observe"

[tool.hatch.build.targets.wheel]
packages = ["src/lens_observe"]
